name: Create GitHub Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the v prefix, for example 0.2.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, tag, and create release
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - name: Require dispatch from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch"
            exit 1
          fi

      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate requested version
        id: version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib

          version = os.environ["RELEASE_VERSION"].strip()
          if not re.fullmatch(r"(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)", version):
              raise SystemExit("Release version must be stable SemVer such as 0.2.0")

          with open("pyproject.toml", "rb") as handle:
              package_version = tomllib.load(handle)["project"]["version"]
          if version != package_version:
              raise SystemExit(
                  f"Requested version {version!r} does not match package version "
                  f"{package_version!r}"
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"tag=v{version}\n")
          PY

      - name: Verify tag and release availability
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git fetch --tags --force

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            TARGET="$(git rev-list -n 1 "$TAG")"
            if [ "$TARGET" != "$GITHUB_SHA" ]; then
              echo "::error::Tag $TAG already points to a different commit"
              exit 1
            fi
            echo "Reusing existing tag $TAG at $TARGET"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::GitHub Release $TAG already exists"
            exit 1
          fi

      - name: Install development and build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' build twine

      - name: Run release quality gates
        run: |
          ruff check src tests __init__.py
          pytest
          python -m compileall -q src tests __init__.py

      - name: Build and validate distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m build
          python -m twine check dist/*

      - name: Smoke-test built wheel and MCP stdio
        env:
          ACADEMIC_RESEARCH_CONFIG_DIR: ${{ runner.temp }}/academic-research-empty-config
        run: |
          SMOKE_VENV="$RUNNER_TEMP/academic-research-release-smoke"
          python -m venv "$SMOKE_VENV"
          "$SMOKE_VENV/bin/python" -m pip install dist/*.whl
          "$SMOKE_VENV/bin/academic-research" --version
          "$SMOKE_VENV/bin/academic-research" doctor --json
          "$SMOKE_VENV/bin/python" - <<'PY'
          import asyncio
          import json
          import os
          import sys
          from pathlib import Path

          from mcp import ClientSession, StdioServerParameters
          from mcp.client.stdio import stdio_client


          async def smoke() -> None:
              executable = str(Path(sys.executable).with_name("academic-research"))
              parameters = StdioServerParameters(
                  command=executable,
                  args=["serve"],
                  env=dict(os.environ),
              )
              async with stdio_client(parameters) as (read_stream, write_stream):
                  async with ClientSession(read_stream, write_stream) as session:
                      await session.initialize()
                      tools = await session.list_tools()
                      names = {tool.name for tool in tools.tools}
                      if len(names) != 8 or "research_provider_status" not in names:
                          raise SystemExit(f"Unexpected MCP tools: {sorted(names)}")
                      result = await session.call_tool("research_provider_status", {})
                      if result.is_error:
                          raise SystemExit("MCP provider status returned an error")
                      payload = json.loads(result.content[0].text)
                      providers = payload.get("providers", {})
                      arxiv = providers.get("arxiv", {})
                      if not (
                          payload.get("success")
                          and arxiv.get("available")
                          and arxiv.get("authentication") == "not_required"
                      ):
                          raise SystemExit(
                              f"Unexpected MCP provider status: {payload}"
                          )


          asyncio.run(smoke())
          PY

      - name: Create annotated tag when needed
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$TAG"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create GitHub Release with distributions
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            dist/*.whl dist/*.tar.gz \
            --verify-tag \
            --title "$TAG" \
            --generate-notes

      - name: Dispatch trusted PyPI publishing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: gh workflow run publish.yml --ref main --field tag="$TAG"

      - name: Write run summary
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "## Release created"
            echo
            echo "- GitHub Release: $TAG"
            echo "- PyPI publishing: dispatched through publish.yml"
            echo "- If publishing fails, rerun Publish to PyPI manually with tag $TAG"
          } >> "$GITHUB_STEP_SUMMARY"
