name: Publish to PyPI

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag:
        description: Git tag to publish
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish distribution
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/academic-research-tools

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag and package version
        env:
          EXPECTED_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          ACTUAL_TAG="$(git describe --tags --exact-match)"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"

          test "$ACTUAL_TAG" = "$EXPECTED_TAG"
          test "$EXPECTED_TAG" = "v$PACKAGE_VERSION"

          echo "Publishing package version $PACKAGE_VERSION from tag $ACTUAL_TAG"

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: |
          rm -rf dist build src/*.egg-info
          python -m build

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
