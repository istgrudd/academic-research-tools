[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "academic-research-tools"
version = "0.1.0"
description = "Evidence-grounded academic literature discovery for AI agents, MCP clients, and Python applications."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Rudi Firdaus", email = "digitalrudi14@gmail.com" },
]
keywords = ["academic-research", "arxiv", "scopus", "semantic-scholar", "mcp"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  "mcp>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8",
  "ruff>=0.9",
]

[project.scripts]
academic-research = "academic_research.cli:main"
academic-research-mcp = "academic_research.mcp_server:main"

[project.entry-points."hermes_agent.plugins"]
academic-research = "academic_research.hermes_plugin:register"

[project.urls]
Homepage = "https://github.com/OWNER/academic-research-tools"
Documentation = "https://github.com/OWNER/academic-research-tools#readme"
Issues = "https://github.com/OWNER/academic-research-tools/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
academic_research = ["skills/*/SKILL.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
