name: scopus-research
version: 1.2.0
description: Official Scopus, arXiv, and Semantic Scholar research tools; optional Google Scholar via SerpAPI.
author: Rudi Firdaus + Hermes Agent
kind: standalone
provides_tools:
  - arxiv_search
  - semantic_scholar_search
  - scopus_search
  - scopus_abstract
  - scopus_author_search
  - google_scholar_search
requires_env:
  - name: ELSEVIER_API_KEY
    description: Elsevier Developer API key for Scopus APIs
    url: https://dev.elsevier.com/
    secret: true
